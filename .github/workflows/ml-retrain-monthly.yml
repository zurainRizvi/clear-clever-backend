name: ML Retrain Monthly

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Export production training snapshots
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: python ml/scripts/export_atlas_training.py

      - name: Train hybrid candidate models
        run: |
          python ml/scripts/export_for_node.py \
            --model all \
            --data-source hybrid \
            --version-suffix v2 \
            --candidate \
            --blend-ratio 0.3

      - name: Upload candidates to backend registry
        env:
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
          ML_RETRAIN_API_KEY: ${{ secrets.ML_RETRAIN_API_KEY }}
        run: python ml/scripts/upload_ml_candidates.py --model all --version-suffix v2

      - name: Upload retrain artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: ml-retrain-${{ github.run_id }}
          path: |
            ml/reports/model_comparison.json
            ml/reports/production/export_summary.json
            src/ml/artifacts/candidates/*.json
