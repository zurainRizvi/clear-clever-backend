name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            mongodb-binaries-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Guard — build must fail without devDependencies
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          if npm run build 2>/dev/null; then
            echo "Build unexpectedly succeeded without devDependencies"
            exit 1
          fi
          echo "OK: build correctly requires devDependencies (Render: npm ci --include=dev && npm run build:render)"

      - name: Reinstall for tests
        run: npm ci

      - name: Test (Jest + supertest + mongodb-memory-server)
        run: npm run test:ci

  deploy-trigger:
    name: Render auto-deploys
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Note
        run: |
          echo "Tests passed on main."
          echo "Render is configured to auto-deploy from this repo's main branch via render.yaml."
          echo "If you set RENDER_DEPLOY_HOOK as a GitHub secret, you can trigger an explicit deploy here."

      - name: Trigger Render deploy hook (optional)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" && echo "Render deploy triggered"
